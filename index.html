<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNG CAFE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TNG CAFE</h1>
        <p>心安らぐ一杯をあなたに</p>

        <nav>
            <ul>
                <li><a href="#AboutUs">About Us</a></li>
                <li><a href="#Menu">Menu</a></li>
                <li><a href="#Contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <section id="AboutUs">
            <h2>About Us</h2>
            <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>
            自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</p>
            <img src="" alt="カフェの写真">
        </section>

        <section id="Menu">
            <h2>Menu</h2>
            <ul>
                <li>
                    <img src="" alt="コーヒー">
                    <p>ブレンドコーヒー</p>
                </li>
                <li>
                    <img src="" alt="ケーキ">
                    <p>ベイクドチーズケーキ</p>
                </li>
                <li>
                    <img src="" alt="ラテ">
                    <p>カフェラテ</p>
                </li>
            </ul>
        </section>

        <section id="Contact">
            <h2>Contact</h2>
            <form action="" method="post">
                <label for="name">お名前：</label>
                <input id="name" name="name" type="text">
                
                <label for="mail">メールアドレス：</label>
                <input id="mail" name="mail" type="email">

                <label for="message">お問い合わせ内容：</label>
                <textarea id="message" name="message"></textarea>

                <input id="subbtn" type="submit" value="送信">
            </form>
        </section>

     </main>
    <footer>
        <p>
            <small>&copy;20○○ TNG Cafe</small>
        </p>
    </footer>

    
</body>
</html>
